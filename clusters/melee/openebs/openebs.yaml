---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openebs
spec:
  patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: openebs
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: openebs
      spec:
        values:
          engines:
            local:
              lvm:
                enabled: true
