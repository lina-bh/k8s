---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nd
spec:
  patches:
  - target:
      kind: StatefulSet
    patch: |
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: nv2-ext4
  - target:
      kind: StatefulSet
    patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: app
      spec:
        template:
          spec:
            containers:
            - name: app
              volumeMounts:
              - name: music
                mountPath: /var/mnt/music/Music
                subPath: Music
                readOnly: true
            volumes:
            # readOnly here (not just on the volumeMount) stops kubelet
            # applying fsGroup ownership to the local PV on the host.
            # Assisted-by: Claude Code:claude-opus-5-5
            - name: music
              persistentVolumeClaim:
                claimName: music
                readOnly: true
