---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sarr
spec:
  patches:
  - target:
      kind: PersistentVolumeClaim
      name: config
    patch: |
      - op: add
        path: /spec/storageClassName
        value: nv2-ext4
  - target:
      kind: Deployment
      name: app
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        template:
          spec:
            containers:
            - name: app
              volumeMounts:
              - name: media
                mountPath: /media
            volumes:
            - name: media
              persistentVolumeClaim:
                claimName: media
