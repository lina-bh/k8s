---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: parr
spec:
  path: ./apps/moving-pictures/parr/bm
  patches:
  - patch: |
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: bm-pg
      spec:
        storage:
          storageClass: nv2-ext4
