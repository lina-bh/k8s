---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qbt
spec:
  patches:
  - target:
      kind: StatefulSet
    patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: nv2-ext4
  - target:
      kind: StatefulSet
    patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: app
      spec:
        template:
          spec:
            containers:
            - name: app
              volumeMounts:
              - name: media
                mountPath: /media
            volumes:
            - name: media
              persistentVolumeClaim:
                claimName: media
