---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sarr
spec:
  patches:
  - target:
      kind: Deployment
      name: app
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        template:
          spec:
            containers:
            - name: app
              volumeMounts:
              - name: moving-pictures
                mountPath: /var/mnt/moving_pictures
            volumes:
            - name: moving-pictures
              persistentVolumeClaim:
                claimName: moving-pictures
