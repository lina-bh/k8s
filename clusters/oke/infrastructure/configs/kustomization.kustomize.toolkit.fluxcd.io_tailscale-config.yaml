---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-config
  namespace: flux-system
spec:
  deletionPolicy: Orphan
  dependsOn:
  - name: tailscale-operator
  path: ./clusters/oke/infrastructure/configs/tailscale/
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
