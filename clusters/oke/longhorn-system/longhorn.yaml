---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
spec:
  patches:
  # Adopt the release installed by the old flux-system/longhorn HelmRelease
  # (default name <targetNamespace>-<name>, stored in flux-system) instead
  # of installing a second one.
  # Assisted-by: Claude Code:claude-opus-5-5
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: longhorn
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: longhorn
      spec:
        releaseName: longhorn-system-longhorn
        storageNamespace: flux-system
        targetNamespace: longhorn-system
