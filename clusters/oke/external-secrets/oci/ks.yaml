---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oci
spec:
  dependsOn:
  - name: external-secrets-operator
  interval: 1h
  path: ./clusters/oke/external-secrets/oci/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  timeout: 15m
  wait: true
