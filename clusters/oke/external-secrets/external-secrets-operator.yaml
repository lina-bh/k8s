---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-operator
spec:
  patches:
  # Adopt the release installed by the old flux-system/external-secrets
  # HelmRelease (default name <targetNamespace>-<name>, stored in
  # flux-system) instead of installing a second one.
  # Assisted-by: Claude Code:claude-opus-5-5
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: external-secrets
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: external-secrets
      spec:
        releaseName: external-secrets-external-secrets
        storageNamespace: flux-system
        targetNamespace: external-secrets
