---
namespace: miniflux
resources:
- ../../../apps/miniflux
- ../../../apps/miniflux/miniflux
patches:
- path: miniflux.yaml
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: miniflux
  patch: |
    - op: add
      path: /spec/dependsOn/-
      value:
        name: longhorn
        namespace: longhorn-system
