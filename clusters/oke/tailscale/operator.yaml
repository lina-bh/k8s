---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: operator
spec:
  # The OKE directory adds the operator-oauth ExternalSecret, which needs
  # the oci ClusterSecretStore from external-secrets-config.
  # Assisted-by: Claude Code:claude-opus-5-5
  dependsOn:
  - name: external-secrets-config
    namespace: flux-system
  path: ./clusters/oke/tailscale/operator
