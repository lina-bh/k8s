---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
spec:
  # Adopt the release installed by the old flux-system/tailscale-operator
  # HelmRelease (default name <targetNamespace>-<name>, stored in
  # flux-system) instead of installing a second one.
  # Assisted-by: Claude Code:claude-opus-5-5
  releaseName: tailscale-tailscale-operator
  storageNamespace: flux-system
  targetNamespace: tailscale
  values:
    apiServerProxyConfig:
      mode: "true"
    operatorConfig:
      hostname: oke
