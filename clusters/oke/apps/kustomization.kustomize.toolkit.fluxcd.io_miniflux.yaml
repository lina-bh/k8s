---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: miniflux
  namespace: flux-system
spec:
  deletionPolicy: Orphan
  path: ./clusters/oke/apps/miniflux/
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
  - name: configs
    namespace: tailscale
  - name: longhorn
    namespace: longhorn-system
  - name: cloudnative-pg
    namespace: cnpg-system
  targetNamespace: default
