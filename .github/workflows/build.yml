on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
      - Containerfile
      - Makefile
      - build_files/**/*
      - system_files/**/*
  workflow_dispatch:
jobs:
  build:
    name: Build and push ghcr.io/${{ github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      NAME: ghcr.io/${{ github.repository }}
    steps:
    - name: Log in to ghcr.io
      uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
      with:
        username: ${{ github.actor }}
        password: ${{ github.token }}
        registry: ${{ env.REGISTRY }}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Build ghcr.io/${{ github.repository }}:latest
      run: make build NAME=${{ env.NAME }} EXTRA_BUILD_ARGS='--label=org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} --annotation=org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}'
    - name: Push latest
      run: make push NAME=${{ env.NAME }}
    - name: Push ${{ github.sha }}
      run: make push_HEAD NAME=${{ env.NAME }}
