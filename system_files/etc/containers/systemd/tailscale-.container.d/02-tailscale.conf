[Container]
Environment=TS_AUTH_ONCE=true
Environment=TS_TAILSCALED_EXTRA_ARGS=--no-logs-no-support
#Environment=TS_EXTRA_ARGS="--advertise-tags=tag:quadlet"
Environment=TS_STATE_DIR=/var/lib/tailscale
Image=ghcr.io/tailscale/tailscale:latest@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
Mount=type=tmpfs,destination=/var/run/tailscale

[Service]
Restart=on-failure
