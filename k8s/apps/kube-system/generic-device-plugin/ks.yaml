---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: generic-device-plugin
spec:
  dependsOn: []
  interval: 1h
  path: ./k8s/apps/kube-system/generic-device-plugin/tun
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: kube-system
  timeout: 15m
  wait: false
