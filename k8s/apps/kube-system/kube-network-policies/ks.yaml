---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-network-policies
spec:
  dependsOn: []
  interval: 1h
  path: ./k8s/apps/kube-system/kube-network-policies/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: kube-system
  timeout: 15m
  wait: true
