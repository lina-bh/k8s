---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: node-feature-discovery
  namespace: kube-system
spec:
  interval: 24h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    digest: sha256:4b012ea6dd8d815a054174310e53051d3e097b381265ff12e0f4b6c77fe2f2b2
    tag: 0.20.0
  url: oci://registry.k8s.io/nfd/charts/node-feature-discovery
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: kube-system
spec:
  chartRef:
    kind: OCIRepository
    name: node-feature-discovery
  install:
    crds: CreateReplace
  interval: 24h
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: DaemonSet
          name: node-feature-discovery-worker
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/securityContext/seLinuxOptions
            value:
              type: spc_t
  upgrade:
    crds: CreateReplace
  values:
    worker:
      config:
        core:
          labelSources:
          - local
