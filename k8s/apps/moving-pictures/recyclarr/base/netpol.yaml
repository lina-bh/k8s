---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol
  labels:
    app.kubernetes.io/app: recyclarr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/app: recyclarr
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: TCP
    - port: 53
      protocol: UDP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: sarr
    ports:
    - port: 8989
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    - ipBlock:
        cidr: ::/0
    ports:
    - port: 443
      protocol: TCP
