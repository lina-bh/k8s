---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: recyclarr
  name: recyclarr-sync
spec:
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: recyclarr
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: recyclarr
        spec:
          automountServiceAccountToken: false
          containers:
          - image: ghcr.io/recyclarr/recyclarr:8.8.0@sha256:b1fbb929ba718fdbdac2c1fc25b32b0ae916d7a5a0892c2068c9bfae6f1a9209
            imagePullPolicy: IfNotPresent
            name: sync
            args:
            - sync
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 65534
              runAsNonRoot: true
              runAsUser: 65534
            volumeMounts:
            - name: config
              mountPath: /config/recyclarr.yml
              subPath: recyclarr.yml
            - name: state
              mountPath: /config
            - name: tmp
              mountPath: /tmp
            - name: sarr-apikey
              mountPath: /run/secrets/sarr-apikey
          hostUsers: false
          restartPolicy: Never
          volumes:
          - name: config
            configMap:
              name: recyclarr-config
          - name: state
            persistentVolumeClaim:
              claimName: recyclarr-state
          - name: tmp
            emptyDir:
              medium: Memory
          - name: sarr-apikey
            secret:
              secretName: sarr-apikey
              items:
              - key: apikey
                path: apikey
  schedule: 0 0 * * *
