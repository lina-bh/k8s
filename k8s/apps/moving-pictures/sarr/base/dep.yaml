---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  template:
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: SONARR__AUTH__METHOD
          value: External
        - name: SONARR__LOG__DBENABLED
          value: "false"
        - name: SONARR__POSTGRES__HOST
          value: pg-rw
        - name: SONARR__POSTGRES__MAINDB
          value: sarr
        - name: SONARR__POSTGRES__USER
          valueFrom:
            secretKeyRef:
              name: sarr-role
              key: username
        - name: SONARR__POSTGRES__PASSWORD
          valueFrom:
            secretKeyRef:
              name: sarr-role
              key: password
        image: ghcr.io/home-operations/sonarr:5.0.0.2701@sha256:2b7958c60a6423bc7be65edf0943a53a8d3da2e71d3b2cb8a503e5cacd693a23
        imagePullPolicy: IfNotPresent
        name: app
        ports:
        - containerPort: 8989
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seLinuxOptions:
            level: null
          readOnlyRootFilesystem: true
          runAsGroup: 995
          runAsNonRoot: true
          runAsUser: 962
        volumeMounts:
        - mountPath: /var/mnt/moving_pictures
          name: moving-pictures
        - mountPath: /config
          name: config
      hostUsers: true
      volumes:
      - name: moving-pictures
        persistentVolumeClaim:
          claimName: moving-pictures
      - name: config
        persistentVolumeClaim:
          claimName: config
      securityContext:
        fsGroup: 995
