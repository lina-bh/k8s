---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  template:
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: SONARR__AUTH__METHOD
          value: External
        - name: SONARR__LOG__DBENABLED
          value: "false"
        - name: SONARR__POSTGRES__HOST
          value: pg-rw
        - name: SONARR__POSTGRES__MAINDB
          value: sarr
        - name: SONARR__POSTGRES__USER
          valueFrom:
            secretKeyRef:
              name: sarr-role
              key: username
        - name: SONARR__POSTGRES__PASSWORD
          valueFrom:
            secretKeyRef:
              name: sarr-role
              key: password
        image: ghcr.io/home-operations/sonarr:5.0.0.2742@sha256:461e64f41e45e95637aae49d660b2116f0f8f43b0f1df86224a0e5f8a1b9f339
        imagePullPolicy: IfNotPresent
        name: app
        ports:
        - name: http
          containerPort: 8989
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seLinuxOptions:
            level: s0
          readOnlyRootFilesystem: true
          runAsGroup: 995
          runAsNonRoot: true
          runAsUser: 962
        volumeMounts:
        - mountPath: /var/mnt/moving_pictures
          name: moving-pictures
        - mountPath: /config
          name: config
        livenessProbe:
          httpGet:
            path: /ping
            port: http
      hostUsers: true
      volumes:
      - name: moving-pictures
        persistentVolumeClaim:
          claimName: moving-pictures
      - name: config
        persistentVolumeClaim:
          claimName: config
      securityContext:
        fsGroup: 995
