---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sarr
spec:
  dependsOn:
  - name: pg-password
    namespace: external-secrets
  - name: postgres
  interval: 1h
  path: ./k8s/apps/moving-pictures/sarr/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: moving-pictures
  timeout: 15m
  wait: true
