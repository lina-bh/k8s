---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    io.github.lina-bh/gluetun: enabled
  name: app
spec:
  replicas: 1
  serviceName: app
  template:
    spec:
      automountServiceAccountToken: false
      containers:
      - image: ghcr.io/home-operations/qbittorrent:5.2.4@sha256:9307627e03981d5473aa31175ea76ed56ea3752333ca49d601b6af45e281e7ba
        imagePullPolicy: IfNotPresent
        name: app
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seLinuxOptions:
            level: s0
          readOnlyRootFilesystem: true
          runAsGroup: 995
          runAsNonRoot: true
          runAsUser: 968
        volumeMounts:
        - mountPath: /config
          name: config
        - name: moving-pictures
          mountPath: /var/mnt/moving_pictures
      securityContext:
        fsGroup: 995
        fsGroupChangePolicy: OnRootMismatch
      volumes:
      - name: moving-pictures
        persistentVolumeClaim:
          claimName: moving-pictures
  volumeClaimTemplates:
  - metadata:
      name: config
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
