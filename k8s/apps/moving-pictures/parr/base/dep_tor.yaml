---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tor
  labels:
    app.kubernetes.io/component: tor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: tor
  template:
    metadata:
      labels:
        app.kubernetes.io/component: tor
    spec:
      automountServiceAccountToken: false
      containers:
      - image: ghcr.io/lina-bh/tor:latest@sha256:0f3da3d7dc78c7d2ff37f64fac81cec923b0edaea50bf257bcc99a8aa6a5f857
        imagePullPolicy: Always
        lifecycle:
          stopSignal: SIGINT
        name: tor
        ports:
        - containerPort: 9050
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
        volumeMounts:
        - name: tor
          mountPath: /etc/tor
        - name: lib
          mountPath: /var/lib
      hostUsers: false
      securityContext:
        fsGroup: 65534
      volumes:
      - name: tor
        configMap:
          name: tor
      - name: lib
        emptyDir: {}
