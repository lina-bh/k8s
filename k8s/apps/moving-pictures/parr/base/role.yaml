---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: role
spec:
  refreshPolicy: CreatedOnce
  dataFrom:
  - sourceRef:
      generatorRef:
        kind: ClusterGenerator
        name: pg-password
  target:
    name: parr-role
    deletionPolicy: Delete
    template:
      type: kubernetes.io/basic-auth
      data:
        username: parr
        password: "{{ .password }}"
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: role
spec:
  name: parr
  login: true
  cluster:
    name: pg
  passwordSecret:
    name: parr-role
