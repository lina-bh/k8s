---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app
spec:
  replicas: 1
  serviceName: app
  template:
    spec:
      automountServiceAccountToken: false
      containers:
      - image: ghcr.io/jellyfin/jellyfin:12.2@sha256:c3efa69a22f2691fc88d6bb035e87a8560e395a6047f062fb381c61c3185e8f5
        imagePullPolicy: IfNotPresent
        name: app
        ports:
        - containerPort: 8096
        resources:
          limits:
            gpu.intel.com/i915: 1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 966
          runAsNonRoot: true
          runAsUser: 966
          seLinuxOptions:
            level: s0
        volumeMounts:
        - mountPath: /cache
          name: cache
        - mountPath: /config
          name: config
        - mountPath: /var/mnt/moving-pictures/tv
          name: moving-pictures
          readOnly: true
          subPath: tv
        - mountPath: /tmp
          name: tmp
      hostUsers: true
      securityContext:
        supplementalGroups:
        - 995
      volumes:
      - emptyDir: {}
        name: cache
      - name: tmp
        emptyDir: {}
      - name: moving-pictures
        persistentVolumeClaim:
          claimName: moving-pictures
  volumeClaimTemplates:
  - metadata:
      name: config
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
