---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nd
spec:
  dependsOn: []
  interval: 1h
  path: ./k8s/apps/music/nd/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: music
  timeout: 15m
  wait: false
