---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol
  labels:
    app.kubernetes.io/name: nd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nd
  policyTypes:
  - Egress
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tailscale
      podSelector:
        matchLabels:
          tailscale.com/parent-resource: nd-app
          tailscale.com/parent-resource-ns: music
          tailscale.com/parent-resource-type: ingress
    ports:
    - port: http
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: TCP
    - port: 53
      protocol: UDP
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    - ipBlock:
        cidr: ::/0
    ports:
    - port: 443
      protocol: TCP
