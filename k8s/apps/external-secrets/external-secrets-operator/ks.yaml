---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
spec:
  dependsOn: []
  interval: 1h
  path: ./k8s/apps/external-secrets/external-secrets-operator/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: external-secrets
  timeout: 15m
  wait: true
