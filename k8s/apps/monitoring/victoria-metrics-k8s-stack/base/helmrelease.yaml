---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-metrics-k8s-stack
spec:
  interval: 24h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    digest: sha256:cacce57f9d0e9ec5d6fc0b8a73061945a57286bd0f0452b174ecdc0587457fc5
    tag: 0.97.0
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  interval: 24h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    vmsingle:
      enabled: false
    vmalert:
      enabled: false
    alertmanager:
      enabled: false
    grafana:
      enabled: false
    defaultDashboards:
      enabled: false
    defaultRules:
      enabled: false
    syncJob:
      enabled: false
    kubelet:
      vmScrape:
        spec:
          interval: 60s
    vmagent:
      spec:
        scrapeInterval: 60s
        extraArgs:
          "remoteWrite.forcePromProto": "true"
        remoteWrite:
        - url: https://prometheus-prod-55-prod-gb-south-1.grafana.net/api/prom/push
          basicAuth:
            username:
              name: grafana-cloud
              key: username
            password:
              name: grafana-cloud
              key: password
