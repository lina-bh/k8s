---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-metrics-k8s-stack
spec:
  interval: 24h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    digest: sha256:cacce57f9d0e9ec5d6fc0b8a73061945a57286bd0f0452b174ecdc0587457fc5
    tag: 0.97.0
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  interval: 24h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    vmsingle:
      enabled: false
    vmalert:
      enabled: false
    alertmanager:
      enabled: false
    grafana:
      enabled: false
    defaultDashboards:
      enabled: false
    defaultRules:
      enabled: false
    syncJob:
      enabled: false
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
          - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            port: https
            scheme: https
            tlsConfig:
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              serverName: kubernetes
            metricRelabelConfigs:
            - action: keep
              source_labels: [__name__]
              regex: "apiserver_client_certificate_expiration_seconds_.*|apiserver_request_(total|terminations_total)|workqueue_(depth|adds_total|retries_total)"
    kubelet:
      vmScrape:
        spec:
          interval: 60s
          metricRelabelConfigs:
          - action: labeldrop
            regex: (uid)
          - action: labeldrop
            regex: (id|name)
          - action: keep
            source_labels:
            - __name__
            regex: kubelet_.*
    vmagent:
      spec:
        scrapeInterval: 60s
        extraArgs:
          "remoteWrite.forcePromProto": "true"
          "remoteWrite.maxHourlySeries": "14000"
        remoteWrite:
        - url: https://prometheus-prod-55-prod-gb-south-1.grafana.net/api/prom/push
          basicAuth:
            username:
              name: grafana-cloud
              key: username
            password:
              name: grafana-cloud
              key: password
