---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus-operator-crds
spec:
  dependsOn: []
  interval: 1h
  path: ./k8s/apps/monitoring/prometheus-operator-crds/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: monitoring
  timeout: 15m
  wait: true
