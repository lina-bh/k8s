---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qbt
spec:
  dependsOn: []
  interval: 1h
  path: ./k8s/apps/base/moving-pictures/qbt/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: moving-pictures
  timeout: 15m
  wait: false
  patches:
  - target:
      kind: StatefulSet
    patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: app
      spec:
        template:
          spec:
            containers:
            - name: app
              volumeMounts:
              - name: moving-pictures
                mountPath: /var/mnt/moving_pictures
            volumes:
            - name: moving-pictures
              persistentVolumeClaim:
                claimName: moving-pictures
