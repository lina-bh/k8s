---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jfin
spec:
  dependsOn: []
  interval: 1h
  path: ./k8s/apps/base/moving-pictures/jfin/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: moving-pictures
  timeout: 15m
  wait: false
  patches:
  - target:
      kind: StatefulSet
    patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: app
      spec:
        template:
          spec:
            containers:
            - name: app
              resources:
                limits:
                  gpu.intel.com/i915: 1
              volumeMounts:
              - name: moving-pictures
                mountPath: /var/mnt/moving-pictures/tv
                subPath: tv
                readOnly: true
            volumes:
            - name: moving-pictures
              persistentVolumeClaim:
                claimName: moving-pictures
