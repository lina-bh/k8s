---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: operator
spec:
  dependsOn: []
  interval: 10m
  path: ./k8s/apps/melee/tailscale/tailscale-operator/operator/melee
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tailscale
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: configs
spec:
  dependsOn:
  - name: operator
  interval: 10m
  path: ./k8s/apps/melee/tailscale/tailscale-operator/configs/melee
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tailscale
  wait: true
