---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: intel-node-feature-rules
spec:
  interval: 24h
  path: "./deployments/nfd/overlays/node-feature-rules"
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: intel-device-plugins-for-kubernetes
  targetNamespace: kube-system
  timeout: 15m
  wait: true
