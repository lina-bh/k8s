---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app
  labels:
    app.kubernetes.io/name: nd
  annotations:
    kustomize.toolkit.fluxcd.io/force: "enabled"
spec:
  replicas: 1
  serviceName: app
  selector:
    matchLabels:
      app.kubernetes.io/name: nd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nd
    spec:
      automountServiceAccountToken: false
      containers:
      - name: app
        image: ghcr.io/navidrome/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 971
          runAsNonRoot: true
          runAsUser: 971
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        ports:
        - name: http
          containerPort: 4533
        envFrom:
        - configMapRef:
            name: env
            optional: false
      hostUsers: true
      volumes:
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app.kubernetes.io/name: nd
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
