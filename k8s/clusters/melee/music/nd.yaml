---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nd
spec:
  patches:
  - target:
      kind: StatefulSet
    patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: app
      spec:
        template:
          spec:
            containers:
            - name: app
              volumeMounts:
              - name: music
                mountPath: /var/mnt/music/Music
                subPath: Music
                readOnly: true
            volumes:
            - name: music
              persistentVolumeClaim:
                claimName: music
