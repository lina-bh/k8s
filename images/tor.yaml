---
accounts:
  groups:
  - gid: 65534
    groupname: nobody
  run-as: nobody:nobody
  users:
  - shell: /sbin/nologin
    uid: 65534
    username: nobody
contents:
  packages:
  - catatonit
  - tor
  repositories:
  - https://dl-cdn.alpinelinux.org/alpine/edge/main
  - https://dl-cdn.alpinelinux.org/alpine/edge/community
entrypoint:
  command: /usr/bin/catatonit -- /usr/bin/tor
stop-signal: SIGINT
