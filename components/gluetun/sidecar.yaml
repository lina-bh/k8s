---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidecar
spec:
  template:
    spec:
      # gluetun reads kube-dns from /etc/resolv.conf when it starts, then
      # points the file, which every container in the pod shares, at itself.
      # It sends local names (no dot, or ending in .local and similar) to
      # kube-dns and the rest to its upstream over DNS over TLS. ndots:1 lets
      # public names skip the search domains. If the gluetun container
      # restarts on its own, it reads back 127.0.0.1 and local names stop
      # resolving until the pod is recreated.
      # Assisted-by: Claude Code:claude-opus-5-5
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      dnsPolicy: ClusterFirst
      initContainers:
      - envFrom:
        - configMapRef:
            name: gluetun-config
        - secretRef:
            name: gluetun
        - configMapRef:
            name: gluetun-overrides
            optional: true
        image: "ghcr.io/qdm12/gluetun:latest@sha256:c6a0f3dc7cf9aba18a057d7d34b2e34d68063cd06a32e5869db34613c430a26a"
        imagePullPolicy: IfNotPresent
        lifecycle:
          stopSignal: SIGKILL
        name: gluetun
        resources:
          limits:
            devic.es/tun: 1
        restartPolicy: Always
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            drop:
            - ALL
          runAsUser: 0
        startupProbe:
          failureThreshold: 24
          httpGet:
            port: 9999
          periodSeconds: 5
      os:
        name: linux
