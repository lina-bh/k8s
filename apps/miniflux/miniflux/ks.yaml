---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: miniflux
spec:
  dependsOn:
  - name: configs
    namespace: tailscale
  - name: cloudnative-pg
    namespace: cnpg-system
  interval: 1h
  path: ./apps/miniflux/miniflux/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: miniflux
  timeout: 15m
  wait: true
