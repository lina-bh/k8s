---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: parr
spec:
  dependsOn:
  - name: pg-password
    namespace: external-secrets
  - name: postgres
  - name: keygen
  interval: 1h
  path: ./apps/moving-pictures/parr/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: moving-pictures
  timeout: 15m
  wait: true
