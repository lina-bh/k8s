---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apikey
spec:
  dataFrom:
  - sourceRef:
      generatorRef:
        kind: Password
        name: keygen
  refreshPolicy: CreatedOnce
  target:
    deletionPolicy: Delete
    template:
      data:
        PROWLARR__APIKEY: "{{ .password }}"
