---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: PROWLARR__AUTH__METHOD
          value: External
        - name: PROWLARR__POSTGRES__USER
          valueFrom:
            secretKeyRef:
              name: parr-role
              key: username
        - name: PROWLARR__POSTGRES__HOST
          value: pg-rw
        - name: PROWLARR__POSTGRES__PASSWORD
          valueFrom:
            secretKeyRef:
              name: parr-role
              key: password
        - name: PROWLARR__POSTGRES__MAINDB
          value: parr
        - name: PROWLARR__LOG__DBENABLED
          value: "false"
        image: ghcr.io/home-operations/prowlarr:2.7.0.5723@sha256:fcf7498692f97698ea8b8f7078a0f81120a16e7354e4c232b5e3810e3e783dff
        imagePullPolicy: IfNotPresent
        name: app
        ports:
        - containerPort: 9696
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
      hostUsers: false
