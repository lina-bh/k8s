---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: app
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: PROWLARR__AUTH__METHOD
          value: External
        - name: PROWLARR__POSTGRES__USER
          valueFrom:
            secretKeyRef:
              key: username
              name: parr-role
        - name: PROWLARR__POSTGRES__HOST
          value: pg-rw
        - name: PROWLARR__POSTGRES__PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: parr-role
        - name: PROWLARR__POSTGRES__MAINDB
          value: parr
        - name: PROWLARR__LOG__DBENABLED
          value: "false"
        envFrom:
        - secretRef:
            name: parr-apikey
            optional: false
        image: ghcr.io/home-operations/prowlarr:3.0.0.5737@sha256:0954599432e16ccd86129f1eb8eb0247fd0d1591aab400f73e2010a1cda37be8
        imagePullPolicy: IfNotPresent
        name: app
        ports:
        - containerPort: 9696
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
      hostUsers: false
