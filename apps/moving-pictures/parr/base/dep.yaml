---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    io.github.lina-bh/gluetun: enabled
  labels:
    app.kubernetes.io/component: app
  name: parr-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: app
  # Each pod opens its own VPN connection, so stop the old pod before
  # starting the new one. Not Recreate: the live object carries the
  # defaulted rollingUpdate fields, which Flux does not own, so switching
  # the type fails validation.
  # Assisted-by: Claude Code:claude-opus-5-5
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: app
      labels:
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: PROWLARR__AUTH__METHOD
          value: External
        - name: PROWLARR__POSTGRES__USER
          valueFrom:
            secretKeyRef:
              key: username
              name: parr-role
        - name: PROWLARR__POSTGRES__HOST
          value: pg-rw
        - name: PROWLARR__POSTGRES__PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: parr-role
        - name: PROWLARR__POSTGRES__MAINDB
          value: parr
        - name: PROWLARR__LOG__DBENABLED
          value: "false"
        envFrom:
        - secretRef:
            name: parr-apikey
            optional: false
        image: ghcr.io/home-operations/prowlarr:3.0.2.5780@sha256:58fa5dbed20738ce0a72077315e818eeb731cb4b4a5173c4a837d343a9573750
        imagePullPolicy: IfNotPresent
        name: app
        ports:
        - containerPort: 9696
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
      hostUsers: false
