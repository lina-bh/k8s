---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: qui
  name: qui-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qui
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: QUI__AUTH_DISABLED
          value: "true"
        - name: QUI__I_ACKNOWLEDGE_THIS_IS_A_BAD_IDEA
          value: "true"
        - name: QUI__AUTH_DISABLED_ALLOWED_CIDRS
          value: "10.244.0.0/24,127.0.0.0/8"
        - name: QUI__TRACKER_ICONS_FETCH_ENABLED
          value: "false"
        - name: QUI__DISABLE_SELF_UPDATE
          value: "true"
        - name: QUI__DATABASE_ENGINE
          value: postgres
        - name: QUI__DATABASE_HOST
          valueFrom:
            secretKeyRef:
              key: host
              name: pg-app
              optional: false
        - name: QUI__DATABASE_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: qui-role
              optional: false
        - name: QUI__DATABASE_PASSWORD_FILE
          value: /run/secrets/role/password
        - name: QUI__SESSION_SECRET_FILE
          value: /run/secrets/session/secret
        image: "ghcr.io/autobrr/qui:v1.35.0@sha256:a5b2f5faf6388cce257137c88e4b189458fd799cf9119ed476c980e5a69341b2"
        imagePullPolicy: IfNotPresent
        name: app
        ports:
        - containerPort: 7476
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /run/secrets/role
          name: role
          readOnly: true
        - mountPath: /run/secrets/session
          name: session
          readOnly: true
      hostUsers: false
      securityContext:
        fsGroup: 65534
      volumes:
      - emptyDir: {}
        name: config
      - name: role
        secret:
          items:
          - key: password
            path: password
          secretName: qui-role
      - name: session
        secret:
          items:
          - key: QUI__SESSION_SECRET
            path: secret
          secretName: qui-session
