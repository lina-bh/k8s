---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rarr
spec:
  dependsOn:
  - name: cloudnative-pg
    namespace: cnpg-system
  - name: external-secrets-operator
    namespace: external-secrets
  interval: 1h
  path: ./apps/moving-pictures/rarr/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: moving-pictures
  timeout: 15m
