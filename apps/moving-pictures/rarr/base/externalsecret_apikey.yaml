---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rarr-apikey
  labels:
    app.kubernetes.io/name: rarr
spec:
  dataFrom:
  - sourceRef:
      generatorRef:
        kind: Password
        name: keygen
  refreshPolicy: CreatedOnce
  target:
    deletionPolicy: Delete
    template:
      metadata:
        labels:
          app.kubernetes.io/name: rarr
      data:
        RADARR__AUTH__APIKEY: "{{ .password }}"
