---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rarr-app
  annotations:
    tailscale.com/proxy-group: ingress
  labels:
    app.kubernetes.io/name: rarr
spec:
  ingressClassName: tailscale
  tls:
  - hosts:
    - r
  defaultBackend:
    service:
      name: rarr-app
      port:
        name: http
