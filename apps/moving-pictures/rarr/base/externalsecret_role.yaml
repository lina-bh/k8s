---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rarr-role
  labels:
    app.kubernetes.io/name: rarr
spec:
  refreshPolicy: CreatedOnce
  dataFrom:
  - sourceRef:
      generatorRef:
        kind: ClusterGenerator
        name: pg-password
  target:
    deletionPolicy: Delete
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          app.kubernetes.io/name: rarr
      data:
        username: rarr
        password: "{{ .password }}"
