---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qui-app
  annotations:
    tailscale.com/proxy-group: ingress
  labels:
    app.kubernetes.io/name: qbt
    app.kubernetes.io/component: qui
    app.kubernetes.io/part-of: qbt
spec:
  ingressClassName: tailscale
  tls:
  - hosts:
    - qui
  defaultBackend:
    service:
      name: qui-app
      port:
        name: http
