---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/name: qbt
    app.kubernetes.io/component: qui
    app.kubernetes.io/part-of: qbt
  name: qui-session
spec:
  dataFrom:
  - sourceRef:
      generatorRef:
        kind: Password
        name: qui-session
  refreshPolicy: CreatedOnce
  target:
    deletionPolicy: Delete
    name: qui-session
    template:
      data:
        QUI__SESSION_SECRET: "{{ .password }}"
      type: Opaque
