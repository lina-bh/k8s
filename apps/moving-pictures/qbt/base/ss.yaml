---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    io.github.lina-bh/gluetun: enabled
  name: qbt-app
spec:
  replicas: 1
  serviceName: qbt-app
  template:
    spec:
      automountServiceAccountToken: false
      containers:
      - command: ["/usr/bin/catatonit", "--", "/bin/sh", "-c", "umask 002 && exec /entrypoint.sh"]
        image: ghcr.io/home-operations/qbittorrent:5.3.1@sha256:fcdbc4ac4a66d8c205ac67e4fe1b578158aaee0a50369c3d04918977f4f359c4
        imagePullPolicy: IfNotPresent
        name: app
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seLinuxOptions:
            level: s0
          readOnlyRootFilesystem: true
          runAsGroup: 995
          runAsNonRoot: true
          runAsUser: 968
        volumeMounts:
        - mountPath: /config
          name: config
      securityContext:
        fsGroup: 995
        fsGroupChangePolicy: OnRootMismatch
  volumeClaimTemplates:
  - metadata:
      name: config
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
