---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bm
spec:
  dependsOn:
  - name: cloudnative-pg
    namespace: cnpg-system
  interval: 1h
  path: ./apps/moving-pictures/bm/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: moving-pictures
  timeout: 15m
  wait: true
