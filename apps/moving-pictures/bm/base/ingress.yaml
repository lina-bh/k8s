---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    tailscale.com/proxy-group: ingress
  labels:
    app.kubernetes.io/name: bm
  name: bm-app
spec:
  defaultBackend:
    service:
      name: bm-app
      port:
        name: http
  ingressClassName: tailscale
  tls:
  - hosts:
    - bm
