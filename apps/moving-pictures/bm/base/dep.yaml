---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    io.github.lina-bh/gluetun: enabled
  labels:
    app.kubernetes.io/name: bm
  name: bm-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bm
  # Each pod opens its own VPN connection; do not run two at once.
  # Assisted-by: Claude Code:claude-opus-5-5
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bm
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - worker
        - run
        - --keys=http_server
        - --keys=queue_server
        - --keys=dht_crawler
        env:
        - name: POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              key: fqdn-uri
              name: bm-pg-app
              optional: false
        image: "ghcr.io/bitmagnet-io/bitmagnet:v0.10.1-beta.1@sha256:9673a7c74b8aaf3471e44425ee23a88eaad0b03892c06ace7210e8d33bab2117"
        imagePullPolicy: IfNotPresent
        name: app
        ports:
        - containerPort: 3333
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
