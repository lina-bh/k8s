---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app
spec:
  replicas: 1
  serviceName: app
  template:
    spec:
      automountServiceAccountToken: false
      containers:
      - image: ghcr.io/jellyfin/jellyfin:12.3@sha256:2038fe038ab3876a80f6e7b7e0aef6607b032c7dc0c9b3ad3296d0b2eba3bbb5
        imagePullPolicy: IfNotPresent
        name: app
        ports:
        - containerPort: 8096
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 966
          runAsNonRoot: true
          runAsUser: 966
          seLinuxOptions:
            level: s0
        volumeMounts:
        - mountPath: /cache
          name: cache
        - mountPath: /config
          name: config
        - mountPath: /tmp
          name: tmp
      hostUsers: true
      securityContext:
        supplementalGroups:
        - 995
      volumes:
      - emptyDir: {}
        name: cache
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: config
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
