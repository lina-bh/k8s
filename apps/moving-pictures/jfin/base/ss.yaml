---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app
spec:
  replicas: 1
  serviceName: app
  template:
    spec:
      automountServiceAccountToken: false
      containers:
      - image: ghcr.io/jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
        imagePullPolicy: IfNotPresent
        name: app
        ports:
        - containerPort: 8096
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 966
          runAsNonRoot: true
          runAsUser: 966
          seLinuxOptions:
            level: s0
        volumeMounts:
        - mountPath: /cache
          name: cache
        - mountPath: /config
          name: config
        - mountPath: /tmp
          name: tmp
      hostUsers: true
      securityContext:
        supplementalGroups:
        - 995
      volumes:
      - emptyDir: {}
        name: cache
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: config
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
