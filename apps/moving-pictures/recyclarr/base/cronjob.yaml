---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: recyclarr
  name: recyclarr-sync
spec:
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: recyclarr
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: recyclarr
        spec:
          automountServiceAccountToken: false
          containers:
          - image: ghcr.io/recyclarr/recyclarr:9.0.0@sha256:4973d11b18b5ef09fb226f4161eecb16434ff7e6b43c56d50fceb52fb22c66c7
            imagePullPolicy: IfNotPresent
            name: sync
            args:
            - sync
            - --log
            - debug
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 65534
              runAsNonRoot: true
              runAsUser: 65534
            volumeMounts:
            - name: config
              mountPath: /config/recyclarr.yml
              subPath: recyclarr.yml
            - name: state
              mountPath: /config
            - name: tmp
              mountPath: /tmp
            - name: sarr-apikey
              mountPath: /run/secrets/sarr-apikey
            - name: rarr-apikey
              mountPath: /run/secrets/rarr-apikey
          hostUsers: false
          restartPolicy: Never
          securityContext:
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
          volumes:
          - name: config
            configMap:
              name: recyclarr-config
          - name: state
            persistentVolumeClaim:
              claimName: recyclarr-state
          - name: tmp
            emptyDir:
              medium: Memory
          - name: sarr-apikey
            secret:
              secretName: sarr-apikey
              items:
              - key: apikey
                path: apikey
          - name: rarr-apikey
            secret:
              secretName: rarr-apikey
              items:
              - key: RADARR__AUTH__APIKEY
                path: apikey
  schedule: 0 0 * * 1
