---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: recyclarr
spec:
  dependsOn:
  - name: sarr
  interval: 1h
  path: ./apps/moving-pictures/recyclarr/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: moving-pictures
  timeout: 15m
  wait: false
