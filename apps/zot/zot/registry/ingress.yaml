---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zot
  labels:
    app.kubernetes.io/name: zot
    app.kubernetes.io/part-of: zot
  annotations:
    tailscale.com/tags: "tag:k8s,tag:registry"
    tailscale.com/proxy-group: ingress
spec:
  ingressClassName: tailscale
  tls:
  - hosts:
    - registry
  defaultBackend:
    service:
      name: zot
      port:
        name: zot
