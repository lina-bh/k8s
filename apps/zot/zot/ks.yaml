---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zot
spec:
  dependsOn: []
  interval: 1h
  path: ./apps/zot/zot/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: zot
  timeout: 15m
  wait: false
