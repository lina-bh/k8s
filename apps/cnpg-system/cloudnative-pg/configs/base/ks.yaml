---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cloudnative-pg-artifacts
spec:
  interval: 24h
  ref:
    branch: main
    commit: 0561523283e43de87e719f6d15e6d41dcd7f8028
  url: https://github.com/cloudnative-pg/artifacts.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: artifacts
spec:
  dependsOn:
  - name: cloudnative-pg
  interval: 1h
  path: ./image-catalogs
  prune: true
  sourceRef:
    kind: GitRepository
    name: cloudnative-pg-artifacts
  targetNamespace: cnpg-system
  timeout: 15m
  wait: true
