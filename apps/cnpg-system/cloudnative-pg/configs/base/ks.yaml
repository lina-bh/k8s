---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cloudnative-pg-artifacts
spec:
  interval: 24h
  ref:
    branch: main
    commit: a8abe796c4e37617d035d389ab97422978b74dbc
  url: https://github.com/cloudnative-pg/artifacts.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: artifacts
spec:
  dependsOn: []
  interval: 1h
  path: ./image-catalogs
  prune: true
  sourceRef:
    kind: GitRepository
    name: cloudnative-pg-artifacts
  targetNamespace: cnpg-system
  timeout: 15m
  wait: true
