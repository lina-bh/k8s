---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-metrics-k8s-stack
spec:
  dependsOn:
  - name: prometheus-operator-crds
  interval: 1h
  path: ./apps/monitoring/victoria-metrics-k8s-stack/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: monitoring
  timeout: 15m
  wait: false
