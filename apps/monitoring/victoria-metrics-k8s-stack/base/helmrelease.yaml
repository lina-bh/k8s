        # Drop unmarked series from this chart's jobs; the flags the vmagent
        # dashboard does not show (it only reads is_set="true"); and cadvisor's
        # pod- and system-level series for metrics whose queries only read
        # container!="" (filesystem, CFS throttling) or image!="" (memory,
        # where pause containers still count). Network series are only
        # reported per pod, with container="", so they stay.
        # Assisted-by: Claude Code:claude-opus-5-5
        - action: drop
          if:
          - '{job=~"apiserver|kubelet|node-exporter|kube-state-metrics|kube-controller-manager|kube-scheduler|kube-etcd|core-dns|vmagent-victoria-metrics-k8s-stack(-reloader-http)?", __tmp_allowed=""}'
          - 'flag{job=~"vmagent-victoria-metrics-k8s-stack(-reloader-http)?", is_set!="true"}'
          - '{__name__=~"container_fs_.+|container_cpu_cfs_throttled_periods_total", job="kubelet", metrics_path="/metrics/cadvisor", container=""}'
          - '{__name__=~"container_memory_(cache|rss|swap)", job="kubelet", metrics_path="/metrics/cadvisor", container="", image=""}'
        remoteWrite:
        - url: https://prometheus-prod-55-prod-gb-south-1.grafana.net/api/prom/push
          basicAuth:
            username:
              name: grafana-cloud
              key: username
            password:
              name: grafana-cloud
              key: password
