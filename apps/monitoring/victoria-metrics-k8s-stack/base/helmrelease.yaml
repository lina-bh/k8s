---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-metrics-k8s-stack
spec:
  interval: 24h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    digest: sha256:cacce57f9d0e9ec5d6fc0b8a73061945a57286bd0f0452b174ecdc0587457fc5
    tag: 0.97.0
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  interval: 24h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    vmsingle:
      enabled: false
    vmalert:
      enabled: false
    alertmanager:
      enabled: false
    grafana:
      enabled: false
    defaultDashboards:
      enabled: false
    defaultRules:
      enabled: false
    syncJob:
      enabled: false
    victoria-metrics-operator:
      serviceMonitor:
        enabled: false
    prometheus-node-exporter:
      # Setting extraArgs replaces the chart's list, so its two filesystem
      # filters are repeated. The netdev and netclass collectors skip pod veth
      # interfaces: 22 series each, under a new name whenever a pod starts.
      # cadvisor's container_network_* already covers per-pod traffic.
      # Assisted-by: Claude Code:claude-opus-5-5
      extraArgs:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$
      - --collector.netdev.device-exclude=^veth
      - --collector.netclass.ignored-devices=^veth
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
          - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            port: https
            scheme: https
            tlsConfig:
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              serverName: kubernetes
            # Keep only the series the apiserver rules and dashboards select.
            # The SLO, burn-rate and availability rules read
            # apiserver_request_sli_duration_seconds_bucket only at le=1, 5, 30
            # and +Inf for these verbs; the other buckets (about 3,000 series)
            # only feed the p99 latency recording rule.
            # Assisted-by: Claude Code:claude-opus-5-5
            metricRelabelConfigs:
            - action: keep
              if:
              # kubernetes-system-apiserver and kubernetes-system alerts
              # Assisted-by: Claude Code:claude-opus-5-5
              - aggregator_unavailable_apiservice
              - aggregator_unavailable_apiservice_total
              - apiserver_client_certificate_expiration_seconds_bucket
              - apiserver_client_certificate_expiration_seconds_count
              - apiserver_request_terminations_total
              - kubernetes_build_info
              - rest_client_requests_total
              # kube-apiserver SLO, burn-rate and availability rules
              # Assisted-by: Claude Code:claude-opus-5-5
              - apiserver_request_total
              - 'apiserver_request_sli_duration_seconds_count{verb=~"LIST|GET|POST|PUT|PATCH|DELETE", subresource!~"proxy|attach|log|exec|portforward"}'
              - 'apiserver_request_sli_duration_seconds_bucket{verb=~"LIST|GET|POST|PUT|PATCH|DELETE", subresource!~"proxy|attach|log|exec|portforward", le=~"(1|5|30)([.]0)?|[+]Inf"}'
              # apiserver and k8s-system-api-server dashboards
              # Assisted-by: Claude Code:claude-opus-5-5
              - apiserver_requested_deprecated_apis
              - go_goroutines
              - process_cpu_seconds_total
              - process_resident_memory_bytes
              - workqueue_adds_total
              - workqueue_depth
    kubelet:
      vmScrape:
        spec:
          interval: 60s
    vmagent:
      spec:
        scrapeInterval: 60s
        extraArgs:
          "remoteWrite.forcePromProto": "true"
          "remoteWrite.maxHourlySeries": "13000"
        # Global relabelling (-remoteWrite.relabelConfig), applied before
        # -remoteWrite.maxHourlySeries counts series. Only this chart's own
        # jobs are filtered; series from any other scrape pass untouched.
        #
        # Series from these jobs are kept only if their name is referenced by
        # the rules and dashboards vmks 0.97.0 would sync with these values:
        # kube-prometheus kubernetesControlPlane, kubePrometheus,
        # kubeStateMetrics and nodeExporter rules, etcd and vmagent rules;
        # kube-prometheus dashboards (minus alertmanager, grafana, proxy,
        # prometheus, prometheus-remote-write, and the Windows, macOS and AIX
        # ones), dotdc k8s-views-*, k8s-system-api-server and
        # k8s-system-coredns, etcd, node-exporter-full and vmagent. The
        # operator is not scraped, so its rules and dashboard are left out, as
        # are recording rule outputs (names containing ":") and time sync
        # (node_timex_*).
        #
        # The first rule marks referenced names; vmagent strips "__"-prefixed
        # labels after relabelling, so __tmp_allowed is never sent.
        # Assisted-by: Claude Code:claude-opus-5-5
        inlineRelabelConfig:
        - action: replace
          source_labels:
          - __name__
          target_label: __tmp_allowed
          replacement: "1"
          regex:
          - ALERTS
          - aggregator_unavailable_apiservice
          - aggregator_unavailable_apiservice_total
