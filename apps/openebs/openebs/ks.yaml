---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openebs
spec:
  dependsOn: []
  interval: 1h
  path: ./apps/openebs/openebs/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: openebs
  timeout: 15m
