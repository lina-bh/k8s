---
apiVersion: v1
kind: ConfigMap
metadata:
  name: iv-container
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
  env:
  - name: INVIDIOUS_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: iv-pg-app
        key: fqdn-uri
  - name: INVIDIOUS_CONFIG_FILE
    value: /etc/invidious/invidious.yml
  envFrom:
  - secretRef:
      name: iv-hmac
  - secretRef:
      name: iv-companion-key
