---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iv-companion-key
  labels:
    app.kubernetes.io/name: iv
spec:
  refreshPolicy: CreatedOnce
  dataFrom:
  - sourceRef:
      generatorRef:
        kind: Password
        name: keygen
  target:
    deletionPolicy: Delete
    template:
      data:
        INVIDIOUS_INVIDIOUS_COMPANION_KEY: "{{ .password }}"
