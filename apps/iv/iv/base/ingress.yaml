---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iv-app
  labels:
    app.kubernetes.io/name: iv
    app.kubernetes.io/component: app
  annotations:
    tailscale.com/proxy-group: ingress
spec:
  ingressClassName: tailscale
  tls:
  - hosts:
    - iv
  defaultBackend:
    service:
      name: iv-app
      port:
        number: 80
