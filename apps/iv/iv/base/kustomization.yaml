---
resources:
- dep.yaml
- pg.yaml
- externalsecret_hmac.yaml
- externalsecret_companion-key.yaml
- container.yaml
- svc.yaml
- ingress.yaml
images:
- name: invidious
  newName: quay.io/invidious/invidious
  newTag: "latest@sha256:ba09cf7b5c749472c3ccc814e6d3efe929243952077ae4dfd7d77ef74fbc9ec5"
configMapGenerator:
- name: iv-cfg
  files:
  - invidious.yml=./resources/invidious.yml
replacements:
- source:
    kind: ConfigMap
    name: iv-container
    fieldPath: data.securityContext
  targets:
  - select:
      kind: Deployment
      name: iv-app
    fieldPaths:
    - spec.template.spec.containers.*.securityContext
    - spec.template.spec.initContainers.*.securityContext
    options:
      create: true
- source:
    kind: ConfigMap
    name: iv-container
    fieldPath: data.env
  targets:
  - select:
      kind: Deployment
      name: iv-app
    fieldPaths:
    - spec.template.spec.containers.*.env
    - spec.template.spec.initContainers.*.env
    options:
      create: true
- source:
    kind: ConfigMap
    name: iv-container
    fieldPath: data.envFrom
  targets:
  - select:
      kind: Deployment
      name: iv-app
    fieldPaths:
    - spec.template.spec.containers.*.envFrom
    - spec.template.spec.initContainers.*.envFrom
    options:
      create: true
