---
resources:
- dep.yaml
- pg.yaml
- externalsecret_hmac.yaml
- externalsecret_companion-key.yaml
- container.yaml
- svc.yaml
- ingress.yaml
- dep_companion.yaml
- svc_companion.yaml
images:
- name: invidious
  newName: quay.io/invidious/invidious
  newTag: "latest@sha256:181ef408b7c3f8197c2462ec951e164a4665ea70601fad8e94eae11f8f42e78d"
configMapGenerator:
- name: iv-cfg
  files:
  - invidious.yml=./resources/invidious.yml
replacements:
- source:
    kind: ConfigMap
    name: iv-container
    fieldPath: data.securityContext
  targets:
  - select:
      kind: Deployment
      name: iv-app
    fieldPaths:
    - spec.template.spec.containers.*.securityContext
    - spec.template.spec.initContainers.*.securityContext
    options:
      create: true
- source:
    kind: ConfigMap
    name: iv-container
    fieldPath: data.env
  targets:
  - select:
      kind: Deployment
      name: iv-app
    fieldPaths:
    - spec.template.spec.containers.*.env
    - spec.template.spec.initContainers.*.env
    options:
      create: true
- source:
    kind: ConfigMap
    name: iv-container
    fieldPath: data.envFrom
  targets:
  - select:
      kind: Deployment
      name: iv-app
    fieldPaths:
    - spec.template.spec.containers.*.envFrom
    - spec.template.spec.initContainers.*.envFrom
    options:
      create: true
