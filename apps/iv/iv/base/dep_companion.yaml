---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iv-companion
  labels:
    app.kubernetes.io/name: iv
    app.kubernetes.io/component: companion
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iv
      app.kubernetes.io/component: companion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iv
        app.kubernetes.io/component: companion
    spec:
      automountServiceAccountToken: false
      containers:
      - name: companion
        image: quay.io/invidious/invidious-companion:latest@sha256:11cfcbd94ea5f25e48e435a4632413e9257a18fa2c87f7192b176fbf1c80935e
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8282
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
        env:
        - name: SERVER_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: iv-companion-key
              key: INVIDIOUS_INVIDIOUS_COMPANION_KEY
              optional: false
        volumeMounts:
        - name: cache
          mountPath: /var/tmp/youtubei.js
      hostUsers: false
      volumes:
      - name: cache
        emptyDir: {}
