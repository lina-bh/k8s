---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: iv
spec:
  dependsOn:
  - name: cloudnative-pg
    namespace: cnpg-system
  - name: external-secrets-operator
    namespace: external-secrets
  interval: 1h
  path: ./apps/iv/iv/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: iv
  timeout: 15m
  wait: true
