---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: descheduler
spec:
  dependsOn:
  - name: metrics-server
  interval: 1h
  path: ./apps/kube-system/descheduler/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: kube-system
  timeout: 15m
  wait: true
