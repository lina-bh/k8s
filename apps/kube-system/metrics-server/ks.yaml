---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
spec:
  dependsOn: []
  interval: 1h
  path: ./apps/kube-system/metrics-server/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: kube-system
  timeout: 15m
  wait: false
