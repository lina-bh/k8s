---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kube-network-policies
spec:
  interval: 24h
  ref:
    commit: 8f76f5594a9356d376e80d2d7232f1614427a634
  url: https://github.com/kubernetes-sigs/kube-network-policies.git
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-network-policies
spec:
  chart:
    spec:
      chart: ./charts/kube-network-policies
      sourceRef:
        kind: GitRepository
        name: kube-network-policies
  interval: 24h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    adminNetworkPolicy: false
    image:
      repository: registry.k8s.io/networking/kube-network-policies
      tag: "v1.1.2@sha256:c671f98e444825d57c590c92da1b5e66070917c4d3dff1f9279775e6b73254fe"
  targetNamespace: kube-system
  postRenderers:
  - kustomize:
      patches:
      - patch: |-
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --disable-nri
        target:
          kind: DaemonSet
          labelSelector: app=kube-network-policies
