---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kube-network-policies
spec:
  interval: 24h
  ref:
    commit: cf488668c33b32694acd96f9afa67689a836c51c
  url: https://github.com/kubernetes-sigs/kube-network-policies.git
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-network-policies
spec:
  chart:
    spec:
      chart: ./charts/kube-network-policies
      sourceRef:
        kind: GitRepository
        name: kube-network-policies
  interval: 24h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    adminNetworkPolicy: false
    image:
      repository: registry.k8s.io/networking/kube-network-policies
      tag: "v1.1.3@sha256:d9350ce205a63ba85c67795191304cef0318d084422ca44da49c4655eeba300d"
  targetNamespace: kube-system
  postRenderers:
  - kustomize:
      patches:
      - patch: |-
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --disable-nri
        target:
          kind: DaemonSet
          labelSelector: app=kube-network-policies
