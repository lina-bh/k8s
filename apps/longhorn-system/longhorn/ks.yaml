---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
spec:
  dependsOn: []
  interval: 1h
  path: ./apps/longhorn-system/longhorn/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: longhorn-system
  timeout: 15m
  wait: true
