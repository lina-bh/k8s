---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pg-password
spec:
  dependsOn:
  - name: external-secrets
  interval: 1h
  path: ./apps/external-secrets/pg-password/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  timeout: 15m
  wait: true
