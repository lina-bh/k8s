---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-path-provisioner
spec:
  dependsOn: []
  interval: 1h
  path: ./apps/local-path-storage/local-path-provisioner/base
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  targetNamespace: local-path-storage
  timeout: 15m
  wait: true
