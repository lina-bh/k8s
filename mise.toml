[settings]
lockfile = true
lockfile_platforms = ["linux-x64"]

[env]
FLATE_CACHE_DIR = "${HOME}/.cache/flate"

[env._]
file = [".env.local"]

[tools]
kubectl = "1.37.2"
flux2 = "2.10.1"
kubeconform = "0.8.0"
kube-linter = "0.8.3"
just = "1.59.0"
"aqua:home-operations/flate" = "0.8.0"
"npm:renovate" = { version = "44.258.3", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
node = "24.22.3"
helm = "4.3.2"
kustomize = "5.8.3"

[tools.helm-diff]
version = "3.15.15"
depends = ["helm"]
postinstall = "helm plugin install $MISE_TOOL_INSTALL_PATH/diff"
